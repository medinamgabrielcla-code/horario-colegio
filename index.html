<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Horario Escolar</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --primary-light: #eff6ff;
      --accent: #f59e0b;
      --accent-light: #fffbeb;
      --bg: #f8fafc;
      --surface: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
      --shadow-md: 0 10px 15px -3px rgba(0,0,0,0.08), 0 4px 6px -2px rgba(0,0,0,0.04);
      --radius: 20px;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px 16px 40px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .app-container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* PANTALLA LOGIN */
    .login-card {
      background: var(--surface);
      padding: 32px 24px;
      border-radius: var(--radius);
      box-shadow: var(--shadow-md);
      text-align: center;
      margin-top: 40px;
      border: 1px solid var(--border);
    }

    .icon-header {
      font-size: 54px;
      margin-bottom: 12px;
      display: inline-block;
    }

    .login-card h2 {
      font-size: 24px;
      font-weight: 800;
      margin: 0 0 8px;
      letter-spacing: -0.5px;
    }

    .login-card p {
      color: var(--muted);
      font-size: 16px;
      margin: 0 0 24px;
      line-height: 1.4;
    }

    .input-field {
      width: 100%;
      padding: 16px;
      font-size: 22px;
      font-weight: 600;
      text-align: center;
      border: 2px solid var(--border);
      border-radius: 14px;
      outline: none;
      transition: all 0.2s ease;
      background: #fdfdfd;
      margin-bottom: 16px;
      letter-spacing: 1px;
    }

    .input-field:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.15);
    }

    .btn {
      width: 100%;
      padding: 16px;
      font-size: 18px;
      font-weight: 700;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
    }

    .btn-primary:active { transform: scale(0.98); background: var(--primary-dark); }

    /* PANTALLA PRINCIPAL */
    .app-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 6px;
    }

    .user-greeting {
      font-size: 20px;
      font-weight: 800;
      color: var(--text);
      margin: 0;
    }

    .btn-logout {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: underline;
    }

    /* SELECTOR DE GRADOS TIPO PÍLDORAS */
    .grades-wrapper {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .grades-scroll {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 6px;
      scrollbar-width: none;
    }

    .grades-scroll::-webkit-scrollbar { display: none; }

    .grade-chip {
      flex: 0 0 auto;
      padding: 10px 18px;
      border-radius: 12px;
      background: var(--surface);
      color: var(--muted);
      font-weight: 700;
      font-size: 15px;
      border: 1px solid var(--border);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .grade-chip.active {
      background: var(--text);
      color: white;
      border-color: var(--text);
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    /* TARJETAS DE DÍA */
    .card {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 22px;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border);
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 6px;
    }

    .card-today::before { background: var(--primary); }
    .card-tomorrow::before { background: var(--accent); }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .card-title {
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .card-today .card-title { color: var(--primary); }
    .card-tomorrow .card-title { color: var(--accent); }

    .cycle-badge {
      font-size: 26px;
      font-weight: 900;
      letter-spacing: -0.5px;
      margin-bottom: 14px;
      display: flex;
      align-items: baseline;
      gap: 8px;
    }

    /* LISTA DE MATERIAS (CHIPS) */
    .subjects-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }

    .subject-pill {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      color: #1e293b;
    }

    /* NOTAS Y RECORDATORIOS */
    .note-box {
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 15px;
      font-weight: 600;
      display: flex;
      align-items: flex-start;
      gap: 8px;
      margin-top: 10px;
    }

    .note-today {
      background: var(--primary-light);
      color: var(--primary-dark);
    }

    .note-tomorrow {
      background: var(--accent-light);
      color: #92400e;
    }

    .alerta {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #dc2626;
      padding: 14px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      margin-top: 14px;
      text-align: left;
    }

    .loading-pulse {
      animation: pulse 1.5s infinite;
      opacity: 0.6;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
  </style>
</head>
<body>

<div class="app-container">

  <!-- VISTA 1: INICIO DE SESIÓN -->
  <div id="loginView" class="login-card">
    <div class="icon-header">🎒</div>
    <h2>Mi Horario Escolar</h2>
    <p>Ingresa tu número de WhatsApp para consultar las clases:</p>
    
    <input type="tel" id="telInput" class="input-field" placeholder="3001234567" inputmode="numeric">
    <button class="btn btn-primary" onclick="iniciarSesion()">Ver Mi Horario</button>
    
    <div id="loginMsg" class="alerta" style="display:none;"></div>
  </div>

  <!-- VISTA 2: APLICACIÓN PRINCIPAL -->
  <div id="appView" style="display:none; flex-direction:column; gap:16px;">
    
    <div class="app-header">
      <h3 id="saludo" class="user-greeting">Hola</h3>
      <button class="btn-logout" onclick="cerrarSesion()">Cambiar número</button>
    </div>

    <!-- SELECTOR DE GRADOS HORIZONTAL (6A a 11B) -->
    <div class="grades-wrapper">
      <div class="grades-scroll" id="gradesScroll"></div>
    </div>

    <!-- TARJETA HOY -->
    <div class="card card-today">
      <div class="card-header">
        <span class="card-title">☀️ Clases de Hoy</span>
      </div>
      <div id="hoyCiclo" class="cycle-badge">...</div>
      <div id="hoyMaterias" class="subjects-list"></div>
      <div id="hoyNota" class="note-box note-today" style="display:none;"></div>
    </div>

    <!-- TARJETA MAÑANA -->
    <div class="card card-tomorrow">
      <div class="card-header">
        <span class="card-title">🎒 Para el próximo día lectivo</span>
      </div>
      <div id="mananaCiclo" class="cycle-badge">...</div>
      <div id="mananaMaterias" class="subjects-list"></div>
      <div id="mananaNota" class="note-box note-tomorrow" style="display:none;"></div>
    </div>

  </div>

</div>

<script>
  // PEGA AQUÍ LA URL DE TU APPS SCRIPT
  const API_URL = "https://script.google.com/macros/s/AKfycbzUCe0DOIGirDZVdLPM1YVyeAXmyaApb8GPENOSpACUMOl9q29VUIkoNZ-7uqG3AAyh/exec";

  const GRADOS = ["6A", "6B", "7A", "7B", "8A", "8B", "9A", "9B", "10A", "10B", "11A", "11B"];
  let gradoActual = localStorage.getItem("app_grado") || "6A";

  function obtenerDeviceId() {
    let id = localStorage.getItem("app_device_id");
    if (!id) {
      id = "dev_" + Math.random().toString(36).substring(2, 9) + Date.now().toString(36);
      localStorage.setItem("app_device_id", id);
    }
    return id;
  }

  window.onload = function() {
    renderizarPildorasGrados();
    const telGuardado = localStorage.getItem("app_tel");
    if (telGuardado) {
      document.getElementById("telInput").value = telGuardado;
      iniciarSesion();
    }
  };

  function renderizarPildorasGrados() {
    const contenedor = document.getElementById("gradesScroll");
    contenedor.innerHTML = "";
    GRADOS.forEach(g => {
      const btn = document.createElement("button");
      btn.className = `grade-chip ${g === gradoActual ? "active" : ""}`;
      btn.innerText = g;
      btn.onclick = () => cambiarGrado(g);
      contenedor.appendChild(btn);
    });
  }

  function cambiarGrado(nuevoGrado) {
    gradoActual = nuevoGrado;
    localStorage.setItem("app_grado", gradoActual);
    renderizarPildorasGrados();
    actualizarHorario();
  }

  async function iniciarSesion() {
    const tel = document.getElementById("telInput").value.trim();
    const msg = document.getElementById("loginMsg");
    msg.style.display = "none";

    if (!tel) {
      msg.innerText = "Escribe tu número de teléfono.";
      msg.style.display = "block";
      return;
    }

    try {
      const devId = obtenerDeviceId();
      const res = await fetch(`${API_URL}?action=validar_usuario&telefono=${encodeURIComponent(tel)}&deviceId=${encodeURIComponent(devId)}`);
      const data = await res.json();

      if (data.success && data.activo) {
        localStorage.setItem("app_tel", tel);
        document.getElementById("saludo").innerText = `Hola, ${data.estudiante || "Estudiante"}`;
        
        if (!localStorage.getItem("app_grado") && data.grado) {
          gradoActual = data.grado;
          renderizarPildorasGrados();
        }

        document.getElementById("loginView").style.display = "none";
        document.getElementById("appView").style.display = "flex";
        actualizarHorario();
      } else {
        msg.innerText = data.mensaje || "Acceso denegado.";
        msg.style.display = "block";
      }
    } catch (e) {
      msg.innerText = "Error conectando con el servidor. Revisa tu internet.";
      msg.style.display = "block";
    }
  }

  async function actualizarHorario() {
    const hoyCiclo = document.getElementById("hoyCiclo");
    const mananaCiclo = document.getElementById("mananaCiclo");
    hoyCiclo.classList.add("loading-pulse");
    mananaCiclo.classList.add("loading-pulse");

    try {
      const res = await fetch(`${API_URL}?action=obtener_horario&grado=${encodeURIComponent(gradoActual)}`);
      const data = await res.json();

      hoyCiclo.classList.remove("loading-pulse");
      mananaCiclo.classList.remove("loading-pulse");

      if (data.success) {
        // 1. Mostrar estado de HOY
        hoyCiclo.innerText = data.hoy.diaCiclo;
        
        if (data.hoy.detalle && data.hoy.detalle.materias) {
          renderChipsMaterias("hoyMaterias", data.hoy.detalle.materias);
        } else {
          document.getElementById("hoyMaterias").innerHTML = 
            `<span style="color:var(--muted); font-size:16px;">Descanso / Sin clases programadas para hoy.</span>`;
        }
        
        const hNota = document.getElementById("hoyNota");
        if (data.hoy.detalle && data.hoy.detalle.notas) {
          hNota.innerHTML = `⚠️ ${data.hoy.detalle.notas}`;
          hNota.style.display = "flex";
        } else {
          hNota.style.display = "none";
        }

        // 2. Mostrar estado del PRÓXIMO DÍA HÁBIL
        mananaCiclo.innerText = data.manana.diaCiclo;

        if (data.manana.detalle && data.manana.detalle.materias) {
          renderChipsMaterias("mananaMaterias", data.manana.detalle.materias);
        } else {
          document.getElementById("mananaMaterias").innerHTML = 
            `<span style="color:var(--muted); font-size:16px;">Sin clases registradas para el próximo día escolar.</span>`;
        }

        const mNota = document.getElementById("mananaNota");
        if (data.manana.detalle && data.manana.detalle.notas) {
          mNota.innerHTML = `🎒 Recuerda: ${data.manana.detalle.notas}`;
          mNota.style.display = "flex";
        } else {
          mNota.style.display = "none";
        }
      }
    } catch (e) {
      hoyCiclo.classList.remove("loading-pulse");
      mananaCiclo.classList.remove("loading-pulse");
      hoyCiclo.innerText = "Error";
      mananaCiclo.innerText = "Error";
    }
  }

  function renderChipsMaterias(containerId, materiasTexto) {
    const contenedor = document.getElementById(containerId);
    contenedor.innerHTML = "";

    if (!materiasTexto) {
      contenedor.innerHTML = `<span style="color:var(--muted); font-size:16px;">Sin materias asignadas</span>`;
      return;
    }

    const lista = materiasTexto.split(",").map(m => m.trim());
    lista.forEach(mat => {
      if (mat) {
        const chip = document.createElement("span");
        chip.className = "subject-pill";
        chip.innerText = mat;
        contenedor.appendChild(chip);
      }
    });
  }

  function cerrarSesion() {
    localStorage.removeItem("app_tel");
    location.reload();
  }
</script>

</body>
</html>
